# Run as the shiny user
run_as shiny;

# Log to stderr so Render captures it
access_log stderr;
server_log stderr;

server {
  # Render injects $PORT at runtime; default fallback = 3838
  listen ${PORT};

  location / {
    site_dir /srv/shiny-server;
    log_dir  /var/log/shiny-server;
    directory_index on;
  }
}
